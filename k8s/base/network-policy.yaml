apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ai-photo-reconstructor
  namespace: ai-photo-reconstructor
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ai-photo-reconstructor
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-system
          podSelector:
            matchLabels:
              app.kubernetes.io/component: gateway
      ports:
        - protocol: TCP
          port: http
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: egress-system
          podSelector:
            matchLabels:
              app.kubernetes.io/component: egress-gateway
      ports:
        - protocol: TCP
          port: 443
