apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ai-photo-reconstructor
  namespace: ai-photo-reconstructor
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ai-photo-reconstructor
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
