services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      STORAGE_PATH: ${STORAGE_PATH:?STORAGE_PATH is required}
      SIGNING_KEY_PROVIDER: ${SIGNING_KEY_PROVIDER:?SIGNING_KEY_PROVIDER is required}
      AUDIT_CONFIG: ${AUDIT_CONFIG:?AUDIT_CONFIG is required}
      LOG_LEVEL: ${LOG_LEVEL:?LOG_LEVEL is required}
    depends_on:
      database:
        condition: service_healthy
      storage:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8000"
    volumes:
      - evidence_data:/var/lib/ai-authentication/evidence
    networks:
      - institution_internal

  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - database_data:/var/lib/postgresql/data
    networks:
      - institution_internal

  storage:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - object_data:/data
    networks:
      - institution_internal

volumes:
  database_data:
  evidence_data:
  object_data:

networks:
  institution_internal:
    internal: true
